<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="50%" stop-color="#f8f6ee" />
      <stop offset="100%" stop-color="#eeebd9" />
    </linearGradient>

    <!-- Olive Accent Gradient -->
    <linearGradient id="oliveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7d8461" />
      <stop offset="100%" stop-color="#555c3c" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ba86" />
      <stop offset="100%" stop-color="#c89b58" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2c2c26" flood-opacity="0.08" />
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#555c3c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Mindful Decorative Background Shapes -->
  <circle cx="1100" cy="80" r="280" fill="#7d8461" fill-opacity="0.03" />
  <circle cx="100" cy="550" r="220" fill="#d4a373" fill-opacity="0.04" />
  <path d="M 0 0 L 1200 0 L 1200 6 L 0 6 Z" fill="url(#oliveGrad)" />

  <!-- Outer Architectural Border Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="#7d8461" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4" />
  <rect x="44" y="44" width="1112" height="542" rx="16" fill="none" stroke="#7d8461" stroke-opacity="0.1" stroke-width="1" />

  <!-- Main Card Container -->
  <g transform="translate(80, 80)">
    
    <!-- Top Meta Row: App Category & Gemini Branding -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="36" rx="6" fill="#7d8461" fill-opacity="0.12" />
      <circle cx="18" cy="18" r="4" fill="#7d8461" />
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#555c3c" letter-spacing="1.5">MINDFUL AI SANCTUARY</text>

      <rect x="242" y="0" width="220" height="36" rx="6" fill="#ffffff" stroke="#ecece0" stroke-width="1" />
      <path d="M 256 18 Q 262 18 262 12 Q 262 18 268 18 Q 262 18 262 24 Q 262 18 256 18 Z" fill="url(#goldGrad)" />
      <text x="276" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#66665c">POWERED BY GEMINI API</text>
    </g>

    <!-- Main Title & Typography -->
    <g transform="translate(0, 72)">
      <text x="0" y="52" font-family="Georgia, 'Lora', serif" font-size="56" font-weight="700" fill="#2c2c26" letter-spacing="-0.5">
        Fuenzer Journal
      </text>
      <text x="0" y="100" font-family="Georgia, 'Lora', serif" font-style="italic" font-size="28" fill="#7d8461">
        Personal Gemini Journal &amp; Socratic Thought Partner
      </text>

      <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#5c5c52" width="600">
        Transform raw introspection into structured clarity through Socratic inquiry,
      </text>
      <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#5c5c52">
        cognitive reframing, multimodal voice reflection, and isolated cloud security.
      </text>
    </g>

    <!-- Feature Chips / Highlights -->
    <g transform="translate(0, 290)">
      <!-- Chip 1: Socratic AI -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#ffffff" stroke="#dedecf" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#7d8461" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2c2c26">Socratic Inquiry</text>
      </g>

      <!-- Chip 2: CBT & Stoicism -->
      <g transform="translate(192, 0)">
        <rect width="210" height="42" rx="8" fill="#ffffff" stroke="#dedecf" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#c89b58" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2c2c26">CBT &amp; Stoic Frameworks</text>
      </g>

      <!-- Chip 3: Voice & Multimodal -->
      <g transform="translate(414, 0)">
        <rect width="190" height="42" rx="8" fill="#ffffff" stroke="#dedecf" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#7d8461" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2c2c26">Multimodal &amp; Voice</text>
      </g>

      <!-- Chip 4: PDF & Data Export -->
      <g transform="translate(616, 0)">
        <rect width="180" height="42" rx="8" fill="#ffffff" stroke="#dedecf" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#555c3c" />
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#2c2c26">Full Client Export</text>
      </g>
    </g>

    <!-- Bottom Footer Inside Card: URL and Creator -->
    <g transform="translate(0, 396)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace, Consolas, sans-serif" font-size="14" font-weight="600" fill="#555c3c">
        https://fuenzer-journal.ai.studio  •  https://journal.fuenzer.web.id
      </text>
      <text x="1040" y="16" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#7d8461">
        Crafted by Ridwan Suryantara
      </text>
    </g>

    <!-- Right Side: Graphic Logo Emblem Shield -->
    <g transform="translate(820, 20)" filter="url(#cardShadow)">
      <!-- Card Container for Emblem -->
      <rect width="220" height="240" rx="24" fill="#ffffff" stroke="#ecece0" stroke-width="1.5" />
      
      <!-- Emblem Logo Box -->
      <g transform="translate(30, 28)" filter="url(#iconShadow)">
        <rect width="160" height="160" rx="36" fill="url(#oliveGrad)" />
        
        <!-- Open Book Pages inside Emblem -->
        <path d="M 80 114 C 64 102 40 100 28 104 C 26 105 24 103 24 101 L 24 52 C 24 50 26 48 28 48 C 42 44 66 47 80 60 C 94 47 118 44 132 48 C 134 48 136 50 136 52 L 136 101 C 136 103 134 105 132 104 C 120 100 96 102 80 114 Z"
              fill="#ffffff" />
        
        <!-- Center Gold Line -->
        <path d="M 80 60 L 80 116" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

        <!-- Star of Clarity -->
        <path d="M 80 26 Q 80 38 68 38 Q 80 38 80 50 Q 80 38 92 38 Q 80 38 80 26 Z" fill="url(#goldGrad)" />
        <circle cx="80" cy="38" r="2" fill="#ffffff" />
      </g>

      <!-- Badge Under Emblem -->
      <text x="110" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#555c3c" letter-spacing="1">FUENZER SANCTUARY</text>
    </g>

  </g>
</svg>
