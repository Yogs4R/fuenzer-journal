<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7d8461" />
      <stop offset="100%" stop-color="#555c3c" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#e8e5d8" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ba86" />
      <stop offset="100%" stop-color="#c89b58" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2a2e1d" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Subtle Geometric Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fdfbf7" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Central Sanctuary Motif: Mindful Open Journal & Socratic Sprout/Spark -->
  <g filter="url(#softGlow)" transform="translate(0, -6)">
    <!-- Journal Base Spine & Open Pages -->
    <path d="M 256 358 C 210 324 140 320 108 328 C 102 329 96 324 96 318 L 96 172 C 96 166 102 161 108 160 C 148 150 216 156 256 190 C 296 156 364 150 404 160 C 410 161 416 166 416 172 L 416 318 C 416 324 410 329 404 328 C 372 320 302 324 256 358 Z"
          fill="url(#leafGrad)" />

    <!-- Center Spine Bookmark Line / Gold Thread -->
    <path d="M 256 190 L 256 364" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round" />
    <polygon points="256,380 250,362 262,362" fill="url(#goldAccent)" />

    <!-- Inner Page Engravings / Mindful Lines -->
    <path d="M 136 202 C 172 196 216 200 236 216 M 136 238 C 172 232 216 236 236 252 M 136 274 C 172 268 216 272 236 288"
          stroke="#7d8461" stroke-width="3" stroke-linecap="round" opacity="0.35" />

    <path d="M 376 202 C 340 196 296 200 276 216 M 376 238 C 340 232 296 236 276 252 M 376 274 C 340 268 296 272 276 288"
          stroke="#7d8461" stroke-width="3" stroke-linecap="round" opacity="0.35" />

    <!-- Socratic AI Star / Spark of Insight Blooming Above Spine -->
    <g transform="translate(256, 126)">
      <!-- 4-Point Star Spark -->
      <path d="M 0 -36 Q 0 0 -36 0 Q 0 0 0 36 Q 0 0 36 0 Q 0 0 0 -36 Z" fill="url(#goldAccent)" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Radiating Insight Petals -->
    <circle cx="214" cy="116" r="3.5" fill="url(#goldAccent)" opacity="0.75" />
    <circle cx="298" cy="116" r="3.5" fill="url(#goldAccent)" opacity="0.75" />
    <circle cx="256" cy="72" r="3" fill="url(#goldAccent)" opacity="0.6" />
  </g>
</svg>
